backend:
  name: git-gateway
  branch: main

local_backend: true

i18n:
  structure: single_file
  locales: [en, no]
  default_locale: en

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - label: "Global"
        name: "global"
        file: "src/_data/settings.yml"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Logo Text", name: "logo_text", widget: "string" }
          - { label: "Language Label", name: "language_label", widget: "string", required: false }
          - { label: "View all link", name: "view_all_link", widget: "string", required: false }
      - label: "Footer"
        name: "footer"
        file: "src/_data/site.yml"
        fields:
          - { label: "Footer Copyright Text", name: "footer_copyright", widget: "string" }
          - {
              label: "Social Intro Text",
              name: "social_intro_text",
              widget: "string",
              required: false,
            }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "Tumblr URL", name: "tumblr_url", widget: "string", required: false }
          - { label: "Bluesky URL", name: "bluesky_url", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    i18n: true
    files:
      - label: "About Page"
        name: "about_page"
        file: "src/_data/about.yml"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Intro", name: "intro", widget: "text", i18n: true }
          - {
              label: "Hero Image",
              name: "hero_image",
              widget: "image",
              required: false,
              i18n: duplicate,
            }
          - { label: "Body", name: "body", widget: "markdown", i18n: true }
          - { label: "Skills Title", name: "skills_title", widget: "string", i18n: true }
          - { label: "Skills Subtext", name: "skills_subtext", widget: "string", i18n: true }
          - {
              label: "Skills List",
              name: "skills_list",
              widget: "list",
              i18n: true,
              fields:
                [
                  {
                    label: "Skill",
                    name: "skill",
                    widget: "object",
                    i18n: true,
                    fields:
                      [
                        { label: "Name", name: "name", widget: "string", i18n: true },
                        { label: "Description", name: "description", widget: "string", i18n: true },
                        {
                          label: "Icon Name",
                          name: "icon_name",
                          widget: "string",
                          i18n: true,
                          required: false,
                        },
                      ],
                  },
                ],
            }
          - { label: "Contact Title", name: "contact_title", widget: "string", i18n: true }
          - { label: "Contact Subtext", name: "contact_subtext", widget: "string", i18n: true }
      - label: "Gallery Page"
        name: "gallery_page"
        file: "src/_data/gallery.yml"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Intro", name: "intro", widget: "text", i18n: true }
          - {
              label: "Books Section Title",
              name: "books_section_title",
              widget: "string",
              i18n: true,
            }
          - {
              label: "Illustrations Section Title",
              name: "illustrations_section_title",
              widget: "string",
              i18n: true,
            }
      - label: "Home Page"
        name: "home_page"
        file: "src/_data/home.yml"
        i18n: true
        fields:
          - { label: "Hero Name", name: "hero_name", widget: "string", i18n: true }
          - { label: "Hero Tagline", name: "hero_tagline", widget: "string", i18n: true }
          - {
              label: "Hero Image",
              name: "hero_image",
              widget: "image",
              required: false,
              i18n: duplicate,
            }
          - { label: "Intro", name: "intro", widget: "markdown", i18n: true }
          - { label: "CTA Text", name: "cta_text", widget: "string", i18n: true }
          - { label: "Gallery title", name: "gallery_title", widget: "string", i18n: true }
          - { label: "Gallery Intro", name: "gallery_intro", widget: "markdown", i18n: true }
          - { label: "Event Title", name: "event_title", widget: "string", i18n: true }
          - { label: "Blog Post Title", name: "blog_post_title", widget: "string", i18n: true }
      - label: "Contact Page"
        name: "contact_page"
        file: "src/_data/contact.yml"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtext", name: "subtext", widget: "string", i18n: true }
          - { label: "Email title", name: "email_title", widget: "string", i18n: true }
          - { label: "Email address", name: "email_address", widget: "string", i18n: duplicate }
          - { label: "Location title", name: "location_title", widget: "string", i18n: true }
          - { label: "Location text", name: "location_text", widget: "string", i18n: true }
          - { label: "Information title", name: "information_title", widget: "string", i18n: true }
          - { label: "Information text", name: "information_text", widget: "string", i18n: true }
          - {
              label: "Frequently Asked Questions title",
              name: "faq_title",
              widget: "string",
              i18n: true,
            }
          - {
              label: "Frequently Asked Questions",
              name: "faqs",
              widget: "list",
              i18n: true,
              fields:
                [
                  { label: "Question", name: "question", widget: "string", i18n: true },
                  { label: "Answer", name: "answer", widget: "markdown", i18n: true },
                ],
            }
      - label: "EventPage"
        name: "event_page"
        file: "src/_data/eventpage.yml"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtext", name: "subtext", widget: "string", i18n: true }
          - {
              label: "Upcoming Events Title",
              name: "upcoming_events_title",
              widget: "string",
              i18n: true,
            }
          - { label: "CTA title", name: "cta_title", widget: "string", i18n: true }
          - { label: "CTA text", name: "cta_text", widget: "string", i18n: true }
          - { label: "CTA button text", name: "cta_button_text", widget: "string", i18n: true }

  - name: "navigation_routes"
    label: "Navigation Routes"
    label_singular: "Route"
    i18n: true
    folder: "src/content/routes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Route (EN)", name: "route_en", widget: "string", required: true, i18n: duplicate }
      - { label: "Route (NO)", name: "route_no", widget: "string", required: true, i18n: duplicate }

  - name: "published_books"
    label: "Published Books"
    label_singular: "Book"
    i18n: true
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "components/pages/work-entry.hbs",
          i18n: duplicate,
        }
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true }
      - {
          label: "Cover Image",
          name: "cover_image",
          widget: "image",
          required: false,
          i18n: duplicate,
        }
      - { label: "Summary", name: "summary", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
      - {
          label: "Cta Link",
          name: "cta_link",
          widget: "string",
          required: false,
          i18n: duplicate,
          hint: "This is for the store link",
        }
      - { label: "CTA Text", name: "cta_text", widget: "string", i18n: true }
      - {
          label: "Publication Year",
          name: "publication_year",
          widget: "string",
          hint: "Use YYYY (example: 2024)",
          pattern: ["^[0-9]{4}$", "Please use a 4-digit year (YYYY)."],
          i18n: duplicate,
        }

  - name: "events"
    label: "Events"
    i18n: true
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          i18n: duplicate,
        }

      - { label: "Location", name: "location", widget: "string", i18n: true }
      - { label: "Summary", name: "summary", widget: "text", i18n: true }
      - { label: "CTA link text", name: "cta_link_text", widget: "string", i18n: true }
      - { label: "Event link", name: "event_link", widget: "string", i18n: duplicate }
      - { label: "Event type", name: "event_type", widget: "string", i18n: true }

  - name: "blog_posts"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "illustrations"
    label: "Illustrations"
    label_singular: "Illustration"
    i18n: true
    folder: "src/content/illustrations"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "components/pages/work-entry.hbs",
          i18n: duplicate,
        }
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - {
          label: "Illustration Image",
          name: "illustration_image",
          widget: "image",
          i18n: duplicate,
        }
      - { label: "Summary", name: "summary", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
