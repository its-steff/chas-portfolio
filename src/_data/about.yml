  intro: >
    Cha Sandmæl (1992) is a comic creator and illustrator living in Oslo,
    Norway. «Eye of the Dragon» is their first published graphic novel,
    published January 2021 with Egmont. Their books have been published in
    Sweden and Denmark, and will also come out in France in 2024.
  contact_subtext: Whether you need illustrations for your fantasy project,
    character designs, or simply want to discuss the art of world-building, I'd
    love to hear from you.
  skills_subtext: A blend of traditional craftsmanship and modern techniques,
    honed over years of dedicated practice.
