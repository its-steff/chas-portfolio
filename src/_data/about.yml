  intro: >
    Cha Sandmæl (f.1992) er en serieskaper fra Oppegård. Hen har studert
    billedkunst med fokus på illustrasjon fire år i Wales, men bor nå i Oslo.
    Hen har laget tegneserier siden 2015, men Dragens Øye (2021, Egmont) er hens
    første tegneserieroman.


    Hen er også utdannet kunst og håndverkslærer (praktisk pedagogisk utdanning ved NTNU, 2019).
